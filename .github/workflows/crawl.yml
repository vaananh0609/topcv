name: TopCV Crawl

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Số trang list (0 = không giới hạn)"
        required: false
        default: "0"
      limit_jobs:
        description: "Giới hạn số job (0 = không giới hạn)"
        required: false
        default: "0"
      no_detail:
        description: "Chỉ crawl list, không vào trang chi tiết"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 18 * * *"  # 01:00 VN (UTC+7) mỗi ngày

jobs:
  crawl:
    # Chạy trên laptop của bạn (self-hosted), tránh IP datacenter GitHub bị TopCV chặn.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run crawler
        shell: pwsh
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          HTTP_PROXY: ${{ secrets.TOPCV_PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.TOPCV_PROXY_URL }}
          TOPCV_PROXY_LIST: ${{ secrets.TOPCV_PROXY_LIST }}
          TOPCV_USE_CURL_CFFI_FIRST: "true"
          DELAY_TOPCV_MIN: "5"
          DELAY_TOPCV_MAX: "10"
        run: |
          if ($env:TOPCV_PROXY_LIST) {
            $env:TOPCV_PROXY_LIST | Out-File -FilePath proxies.txt -Encoding utf8
            $env:PROXY_LIST_FILE = "proxies.txt"
          }
          $args = @(
            "--max-pages", "${{ github.event.inputs.max_pages || '0' }}"
            "--limit-jobs", "${{ github.event.inputs.limit_jobs || '0' }}"
          )
          if ("${{ github.event.inputs.no_detail }}" -eq "true") {
            $args += "--no-detail"
          }
          python topcv-new.py @args
